<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alhanouf Khalid — visual artist and graphic designer</title>
<meta name="description" content="Hi, I'm Alhanouf a visual artist and graphic designer">
<meta name="theme-color" content="#e8e1d6">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./js/vendor/three.module.js","three/addons/":"./js/vendor/addons/"}}</script>
</head>
<body>
<div id="loader" aria-hidden="true">
  <div class="loader-wheel"><span></span></div>
  <p class="loader-txt">Alhanouf Khalid</p>
</div>

<canvas id="scene" aria-label="Portfolio scene"></canvas>
<div id="splats" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="#about" aria-label="About">
    <span class="brand-mark"></span>
    <span class="brand-name" id="brandName">Alhanouf Khalid</span>
  </a>
  <nav class="nav-links">
    <button id="soundBtn" aria-pressed="false" title="Sound">Sound <i>off</i></button>
  </nav>
</header>

<section id="about" aria-label="About"></section>
<main id="content" aria-live="polite"></main>
<aside id="exhibitLabel" hidden></aside>
<aside id="designLabel" hidden></aside>

<div class="hud" id="hud" hidden>
  <div class="counter"><span id="cIdx">01</span><span class="sep">/</span><span id="cTot">01</span></div>
  <div class="hud-title" id="hudTitle"></div>
  <div class="steps">
    <button id="prevBtn" aria-label="Previous">&larr;</button>
    <button id="nextBtn" aria-label="Next">&rarr;</button>
  </div>
</div>

<nav class="scene-nav" id="sceneNav" aria-label="Scenes">
  <button id="sceneToggle" class="scene-toggle" aria-expanded="false">About</button>
  <div class="scene-links">
    <a href="#about" data-scene="about">About</a>
    <a href="#ceramics" data-scene="ceramics">Ceramics</a>
    <a href="#design" data-scene="design">Graphic Design</a>
    <a href="#exhibition" data-scene="exhibition">Exhibition</a>
  </div>
</nav>

<div id="cursor" aria-hidden="true"><span></span></div>
<noscript><p class="noscript">This portfolio needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
